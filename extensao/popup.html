<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="cabecalho">
    <div class="icone-app"><img src="icons/icon128.png" alt="LockGate"></div>
    <div>
      <h1>LockGate</h1>
      <p>Gerador de Senhas</p>
    </div>
  </div>

  <div class="card">
    <div class="linha-titulo">
      <span>TAMANHO</span>
      <span class="valor-tamanho" id="valorTamanho">16 Caracteres</span>
    </div>
    <input type="range" id="tamanho" min="4" max="32" value="16">
  </div>

  <div class="card">
    <label class="opcao">
      <span>Letras maiúsculas <small>A-Z</small></span>
      <span class="toggle"><input type="checkbox" id="maiusculas" checked><span class="slider-toggle"></span></span>
    </label>
    <label class="opcao">
      <span>Letras minúsculas <small>a-z</small></span>
      <span class="toggle"><input type="checkbox" id="minusculas" checked><span class="slider-toggle"></span></span>
    </label>
    <label class="opcao">
      <span>Números <small>0-9</small></span>
      <span class="toggle"><input type="checkbox" id="numeros" checked><span class="slider-toggle"></span></span>
    </label>
    <label class="opcao">
      <span>Caracteres especiais <small>!@#$%</small></span>
      <span class="toggle"><input type="checkbox" id="simbolos"><span class="slider-toggle"></span></span>
    </label>
  </div>

  <div id="resultado"></div>

  <button id="gerar">
    <span>&#8635;</span> Gerar Novas Senhas
  </button>

  <script src="popup.js"></script>
</body>
</html>
